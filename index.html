<!DOCTYPE html>
<html>
<head>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial;
}

/* GIZA + MVUA */
.rain {
  position:fixed;
  width:100%;
  height:100%;
  background: repeating-linear-gradient(100deg, transparent, transparent 2px, rgba(255,255,255,0.1) 2px, rgba(255,255,255,0.1) 3px);
  animation: rain 0.3s linear infinite;
  opacity:0.3;
}
@keyframes rain { to { transform:translateY(100px) } }

/* RADI - FLASH */
.flash {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:10;
}
.flash.active {
  animation: flashAnim 0.4s ease-out;
}
@keyframes flashAnim {
  0% { opacity:0 }
  10% { opacity:1 }
  20% { opacity:0 }
  30% { opacity:0.8 }
  40% { opacity:0 }
  100% { opacity:0 }
}

/* RADI - MISTARI */
.lightning {
  position:fixed;
  top:-20%;
  left:50%;
  width:4px;
  height:120%;
  background: linear-gradient(to bottom, white, #ffcc00, transparent);
  box-shadow: 0 0 20px white, 0 0 40px #ffcc00, 0 0 80px #ffcc00;
  transform: translateX(-50%) rotate(15deg);
  opacity:0;
  z-index:11;
  clip-path: polygon(45% 0, 55% 0, 60% 20%, 40% 25%, 65% 50%, 35% 55%, 55% 100%, 45% 100%, 25% 50%, 55% 45%, 35% 20%);
}
.lightning.active {
  animation: lightningStrike 0.5s ease-out;
}
@keyframes lightningStrike {
  0% { opacity:0; transform: translateX(-50%) rotate(15deg) scaleY(0); }
  10% { opacity:1; transform: translateX(-50%) rotate(15deg) scaleY(1); }
  20% { opacity:0; }
  30% { opacity:1; }
  100% { opacity:0; transform: translateX(-50%) rotate(15deg) scaleY(1); }
}

/* LOGIN - INAJIFICHA MWANZO */
.login-box {
  background: rgba(5,13,37,0.9);
  border: 2px solid #ffcc00;
  padding: 40px;
  border-radius: 20px;
  width: 380px;
  box-shadow: 0 0 30px rgba(255,204,0,0.5), inset 0 0 20px rgba(255,204,0,0.1);
  transform: scale(0) rotateY(180deg);
  opacity:0;
  z-index:5;
  backdrop-filter: blur(10px);
}
.login-box.show {
  animation: loginAppear 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
}
@keyframes loginAppear {
  0% { transform: scale(0) rotateY(180deg); opacity:0; }
  60% { transform: scale(1.2) rotateY(0deg); opacity:1; }
  100% { transform: scale(1) rotateY(0deg); opacity:1; }
}

.login-box h2 { color:#ffcc00; text-align:center; margin-bottom:25px; font-size:28px; text-shadow:0 0 15px #ffcc00; }
.login-box input {
  width:100%; padding:14px; margin:10px 0; border-radius:10px; border:1px solid #ffcc00;
  background:rgba(0,0,0,0.6); color:white; outline:none; font-size:16px;
}
.login-box button {
  width:100%; padding:14px; margin-top:20px; background:linear-gradient(90deg,#ffcc00,#ff9900);
  border:none; border-radius:10px; font-weight:900; font-size:18px; cursor:pointer;
  box-shadow:0 0 20px #ffcc00; transition:0.3s;
}
.login-box button:hover { transform:scale(1.05); box-shadow:0 0 40px #ffcc00; }

/* BUTTON YA KUANZA */
#startBtn {
  position:fixed; z-index:20; padding:15px 40px; font-size:20px; font-weight:900;
  background:#ffcc00; border:none; border-radius:50px; cursor:pointer;
  box-shadow:0 0 30px #ffcc00; animation: pulse 1s infinite alternate;
}
@keyframes pulse { to { transform:scale(1.1); } }
</style>
</head>
<body>

<div class="rain"></div>
<div class="flash" id="flash"></div>
<div class="lightning" id="lightning"></div>

<button id="startBtn" onclick="strike()">⚡ PIGA RADI</button>

<div class="login-box" id="login">
  <h2>⚡ LOGIN ⚡</h2>
  <input type="text" placeholder="Username / Email">
  <input type="password" placeholder="Password">
  <button>INGIA 🔓</button>
  <p style="color:#aaa;text-align:center;margin-top:15px;font-size:13px">Imeletwa na Radi ⚡</p>
</div>

<script>
function strike(){
  document.getElementById('startBtn').style.display='none';
  
  const flash = document.getElementById('flash');
  const lightning = document.getElementById('lightning');
  const login = document.getElementById('login');

  // PIGA RADI
  setTimeout(()=>{ flash.classList.add('active'); lightning.classList.add('active'); }, 200);
  
  // SAUTI YA RADI (browser beep)
  let audio = new Audio('https://www.soundjay.com/mechanical/sounds/thunder-01.mp3');
  audio.volume = 0.5;
  audio.play().catch(()=>{});

  // LOGIN INATOKA BAADA YA RADI
  setTimeout(()=>{
    login.classList.add('show');
  }, 800);

  // RADI YA PILI NDOGO
  setTimeout(()=>{
    flash.classList.remove('active');
    setTimeout(()=>{ flash.classList.add('active'); },50);
  }, 1200);
}
</script>
</body>
</html>
