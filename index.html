<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin:0; background:#050d25; height:100vh;
  display:flex; justify-content:center; align-items:center;
  overflow:hidden; font-family:Arial Black;
}
.person-img {
  width:350px; cursor:pointer; z-index:2;
  transition:0.3s;
  filter: drop-shadow(0 0 20px rgba(255,204,0,0.5));
}
.person-img.clap {
  animation: clapAnim 0.5s ease-out;
}
@keyframes clapAnim {
  0% { transform: scale(1); }
  30% { transform: scale(1.2) rotate(2deg); }
  60% { transform: scale(0.95) rotate(-2deg); }
  100% { transform: scale(1); }
}
.clap-burst {
  position:absolute; left:50%; top:45%;
  font-size:80px; font-weight:900; color:#ffcc00;
  transform:translate(-50%,-50%) scale(0);
  text-shadow:0 0 30px white; opacity:0; pointer-events:none;
}
.clap-burst.show { animation: pah 0.7s forwards; }
@keyframes pah {
  0% { transform:translate(-50%,-50%) scale(0); opacity:0; }
  40% { transform:translate(-50%,-50%) scale(1.5); opacity:1; }
  100% { transform:translate(-50%,-50%) scale(2.2); opacity:0; }
}
.login {
  position:absolute; background:white; padding:35px;
  border-radius:20px; width:360px; box-shadow:0 20px 60px black;
  transform:scale(0); opacity:0; z-index:10;
}
.login.show { animation: pop 0.8s cubic-bezier(0.68,-0.55,0.265,1.55) forwards; }
@keyframes pop {
  to { transform:scale(1); opacity:1; }
}
.login input{ width:100%; padding:14px; margin:8px 0; border-radius:10px; border:2px solid #ddd; }
.login button{ width:100%; padding:14px; background:#050d25; color:#ffcc00; border:none; border-radius:10px; font-weight:900; margin-top:10px; }
.hint{ position:fixed; bottom:25px; color:#ffcc00; animation:blink 1s infinite; }
@keyframes blink{ 50%{ opacity:0.3 } }
</style>
</head>
<body>

<img src="clap.png" id="person" class="person-img" onclick="clapNow()">

<div class="clap-burst" id="burst">PAH! 👏</div>

<div class="login" id="login">
  <h2 style="text-align:center;margin-bottom:15px">🔓 LOGIN</h2>
  <input placeholder="Email">
  <input type="password" placeholder="Password">
  <button>INGIA</button>
</div>

<p class="hint" id="hint">👆 BONYEZA KATUNI APIGE KOFI</p>

<script>
function clapNow(){
  document.getElementById('person').classList.add('clap');
  document.getElementById('burst').classList.add('show');
  document.getElementById('hint').style.display='none';
  
  setTimeout(()=>{
    document.getElementById('login').classList.add('show');
    document.getElementById('person').style.transform='scale(0.6) translateY(-200px)';
    document.getElementById('person').style.opacity='0.4';
  },500);
}
</script>
</body>
</html>
