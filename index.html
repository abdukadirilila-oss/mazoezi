!DOCTYPE html>
<html>
<head>
<style>
body {
  margin:0;
  background:#050d25;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Courier New', monospace;
}
#text {
  font-size:70px;
  font-weight:900;
  color:#ffcc00;
  border-right:4px solid #ffcc00;
  white-space:nowrap;
  overflow:hidden;
  text-shadow: 0 0 20px #ffcc00, 0 0 40px #ff9900;
  letter-spacing:3px;
}
.cursor {
  animation: blink 0.7s infinite;
}
@keyframes blink {
  0%, 50% { border-color:#ffcc00 }
  51%, 100% { border-color:transparent }
}
/* Background glow */
body::before {
  content:'';
  position:absolute;
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(255,204,0,0.15) 0%, transparent 70%);
  animation: pulse 2s infinite alternate;
}
@keyframes pulse {
  to { transform:scale(1.2); opacity:0.5 }
}
</style>
</head>
<body>

<div id="text"></div>

<script>
const sentences = [
  "MATARI ELECTRICAL...",
  "FUNDI WA UMEKE ⚡",
  "BEI POA SANA 🔥",
  "PIGA: 0787 571 967 📞"
];

let sentenceIndex = 0;
let charIndex = 0;
let isDeleting = false;
const textEl = document.getElementById('text');

function type() {
  const current = sentences[sentenceIndex];
  
  if (!isDeleting) {
    // Anaandika
    textEl.innerText = current.substring(0, charIndex+1);
    charIndex++;
    
    if (charIndex === current.length) {
      // Kaandika wote, subiri kidogo halafu futa
      setTimeout(()=>{ isDeleting = true; type(); }, 2000);
      return;
    }
  } else {
    // Anafuta
    textEl.innerText = current.substring(0, charIndex-1);
    charIndex--;
    
    if (charIndex === 0) {
      isDeleting = false;
      sentenceIndex = (sentenceIndex + 1) % sentences.length;
    }
  }
  
  let speed = isDeleting ? 40 : 100;
  setTimeout(type, speed);
}

type();
</script>
</body>
</html>
